# 운영 배포 구성. 개발 구성은 compose.dev.yaml이 다룬다.
#
# 실행: cp .env.prod.example .env 로 값을 채운 뒤 OPERATIONS.md의 최초 배포·변경 절차를 따른다.
# 기본 up은 스키마를 적용하지 않는다. 서버·작업자 정지와 백업 뒤 migrate up → audit을 명시적으로
# 실행하고 감사가 성공한 다음에 server를 기동한다.
#
# 호스트의 cloudflared가 암호화된 Cloudflare Tunnel 요청을 http://localhost:80으로 전달한다.
# 커넥터는 Compose 밖에서 관리한다. 로컬 HTTP 원본은 암호화되지 않는 시험 운영 예외다.
# 호스트 신뢰 경계와 보안 제약은 OPERATIONS.md를 따른다. DB는 호스트에 공개하지 않는다.
# 프로젝트 이름을 고정해 같은 호스트의 개발 구성과 컨테이너·볼륨이 섞이지 않게 한다.
name: agent_context_prod

# migrate와 server가 함께 받는 애플리케이션 구성이다. 나머지 배포 구성 값은 .env에서
# 읽고, 아래 값만 이 배치에 맞게 덮어쓴다.
x-app-environment: &app-environment
  # 비밀번호는 URL에 그대로 넣으므로 영문·숫자처럼 퍼센트 인코딩이 필요 없는 문자만 쓴다.
  DATABASE_URL: postgres://${POSTGRES_USER:-agent_context}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD가 필요하다}@db:5432/${POSTGRES_DB:-agent_context}
  # 컨테이너 로컬 시각. 저장·응답 시각은 코드가 UTC로 정규화한다.
  TZ: ${TZ:-Asia/Seoul}

services:
  db:
    build: .
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agent_context}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD가 필요하다}
      POSTGRES_DB: ${POSTGRES_DB:-agent_context}
      TZ: ${TZ:-Asia/Seoul}
    volumes:
      - db_data:/var/lib/postgresql
      # 보관본은 데이터와 다른 볼륨에 둔다. 기본 백업과 함께 따로 옮기거나 정리하기 위해서다.
      - wal_archive:/var/lib/postgresql/wal_archive
    # 「백업과 복구」가 시점 복구를 백업 방식으로 확정했으므로 WAL 보관을 켠다. 개발 구성의
    # 시간 기준 정리는 운영 보존 정책으로 쓰지 않는다. 보관본은 계속 쌓이므로 운영자가 기본
    # 백업을 받은 뒤 그 백업보다 오래된 보관본을 정리하고 볼륨 사용량을 감시한다.
    command:
      - postgres
      - -c
      - shared_preload_libraries=age
      - -c
      - archive_mode=on
      - -c
      - archive_command=/usr/local/bin/agent-context-wal-archive %p %f
      # 세션 시간대는 볼륨 초기화 시점과 무관하게 UTC로 고정하고 서버 로그 시각만 TZ를 따른다.
      - -c
      - timezone=UTC
      - -c
      - log_timezone=${TZ:-Asia/Seoul}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agent_context} -d ${POSTGRES_DB:-agent_context}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # 스키마 적용. 실행 중인 이전 서버 옆에서 새 판의 SQL이 적용되지 않도록 기본 up에서 빼고
  # `run --rm --no-deps migrate migrate up`으로만 실행한다. 이름을 지정한 실행은 profile을 켜지 않아도 된다.
  migrate:
    profiles: ["migrate"]
    build: &app-build
      context: .
      dockerfile: Dockerfile.server
    image: agent_context_prod-app
    command: ["migrate", "up"]
    env_file:
      - path: .env
        required: false
    environment: *app-environment
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  server:
    build: *app-build
    image: agent_context_prod-app
    command: ["server"]
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      <<: *app-environment
      HTTP_ADDR: ":8080"
      TLS_TERMINATION: proxy
      # Linux Docker에서 호스트의 루프백 공개 포트로 들어오는 접속 경로만 신뢰한다.
      # 실제 접속 상대와 단일 X-Forwarded-Proto: https를 함께 검증한다.
      # 같은 호스트의 다른 프로세스도 이 경로를 사용할 수 있다. 전체 Docker 대역이나
      # Cloudflare 공인 접속 대역은 신뢰하지 않는다.
      TRUSTED_PROXY_CIDRS: "10.203.0.1/32"
      TLS_CERT_FILE: ""
      TLS_KEY_FILE: ""
      # 고정 마운트 밖으로 로그가 쓰이지 않게 하고 재생성에도 같은 슬롯을 사용한다.
      DIAGNOSTIC_LOG_DIR: /var/log/agent-context
      DIAGNOSTIC_INSTANCE_ID: ${DIAGNOSTIC_INSTANCE_ID:?안정적인 DIAGNOSTIC_INSTANCE_ID가 필요하다}
    volumes:
      - diagnostic_logs:/var/log/agent-context
    ports:
      - "127.0.0.1:${HTTP_PORT:-80}:8080"
    # 스키마 적용 여부는 기동 순서로 보장하지 않는다. 운영 절차가 적용·감사 성공 뒤에 기동한다.
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # 상태 확인 경로만 전달 헤더 없이 내부 HTTP 프로브를 허용한다.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
    # 서버는 종료 신호 뒤 요청을 30초, 작업자를 10초까지 기다린다. 그보다 길게 멈추면
    # 강제 종료한다.
    stop_grace_period: 50s

networks:
  default:
    ipam:
      config:
        - subnet: 10.203.0.0/24
          gateway: 10.203.0.1

volumes:
  db_data:
  wal_archive:
  diagnostic_logs:
