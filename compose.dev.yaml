# 개발용 DB·임베딩 제공자와 선택적 애플리케이션 서버.
# 호스트의 cloudflared 원본 http://localhost:80:
#   docker compose -f compose.dev.yaml --profile server up -d --build
x-app-environment: &app-environment
  DATABASE_URL: postgres://${POSTGRES_USER:-agent_context}:${POSTGRES_PASSWORD:-agent_context}@db:5432/${POSTGRES_DB:-agent_context}

services:
  db:
    build: .
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agent_context}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agent_context}
      POSTGRES_DB: ${POSTGRES_DB:-agent_context}
    ports:
      # 로컬 개발용 자격 증명을 외부 인터페이스에 공개하지 않는다.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18부터 공식 이미지가 /var/lib/postgresql 아래 판별 하위 디렉터리에
      # 데이터를 두므로 /var/lib/postgresql/data가 아니라 상위를 마운트한다.
      - db_data:/var/lib/postgresql
    # 베이스 이미지의 CMD를 덮으므로 shared_preload_libraries=age를 그대로 다시 준다.
    # WAL 보관을 켜는 이유는 「백업과 복구」가 시점 복구를 백업 방식으로 확정했고, AGE가
    # 그래프를 스키마 OID로 기록해 논리 덤프로는 복원이 성립하지 않기 때문이다. 보관 경로는
    # 데이터 볼륨 안에 두고 기동 래퍼가 새 볼륨·기존 볼륨 모두에서 준비한다.
    command:
      - postgres
      - -c
      - shared_preload_libraries=age
      - -c
      - archive_mode=on
      - -c
      - archive_command=test ! -f /var/lib/postgresql/wal_archive/%f && cp %p /var/lib/postgresql/wal_archive/%f
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agent_context} -d ${POSTGRES_DB:-agent_context}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # WAL 보관본 정리. `archive_mode=on`이 켜져 있는 한 PostgreSQL은 보관한 파일을
  # 지우지 않으므로 개발 구성에서는 보관 디렉터리가 계속 커진다. 개발 구성은 기본
  # 백업을 남겨 두지 않고 시점 복구를 확인할 때마다 그 자리에서 새로 받으므로,
  # 보관 기간을 지난 WAL은 되돌릴 대상이 없어 쓸모가 없다. 기본 7일이며 운영 배포
  # 구성은 이 파일이 다루지 않는다.
  #
  # `pg_archivecleanup`이 아니라 시간 기준으로 지우는 이유는 그 도구가 남겨 둘 가장
  # 오래된 WAL 이름을 기본 백업의 `.backup` 파일에서 받는데, 개발 구성에는 그 기준이
  # 되는 기본 백업이 없기 때문이다.
  wal_cleanup:
    build: .
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - db_data:/var/lib/postgresql
    # 보관 파일의 소유자와 같은 사용자로 지운다.
    user: postgres
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        while true; do
        find /var/lib/postgresql/wal_archive -type f
        -mtime +${WAL_ARCHIVE_RETENTION_DAYS:-7} -delete;
        sleep 86400;
        done

  # 기본 기동은 기존처럼 DB·WAL 정리만 수행한다. 서버 profile에서 스키마를 먼저 적용한다.
  migrate:
    profiles: [server]
    build: &app-build
      context: .
      dockerfile: Dockerfile.server
    image: agent_context_dev-app
    command: ["migrate", "up"]
    env_file:
      - path: .env
        required: false
    environment: *app-environment
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  server:
    profiles: [server]
    build: *app-build
    image: agent_context_dev-app
    command: ["server"]
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      <<: *app-environment
      HTTP_ADDR: ":8080"
      TLS_TERMINATION: proxy
      # Linux Docker에서 호스트의 loopback 공개 포트로 들어오는 경로만 신뢰한다.
      TRUSTED_PROXY_CIDRS: "10.204.0.1/32"
      TLS_CERT_FILE: ""
      TLS_KEY_FILE: ""
    ports:
      - "127.0.0.1:80:8080"
    networks:
      default: {}
      tunnel:
        priority: 1
        gw_priority: 1
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
    stop_grace_period: 50s

  # Gemini 개발 기본값과 비교하거나 Ollama 구성으로 복귀할 때 사용하는 제공자.
  # 기본 기동에서 제외하며 --profile ollama로 명시적으로 기동한다.
  # Gemini 실패 시 자동 대체하지 않는다. 태그와 다중 아키텍처 digest를 함께 고정한다.
  ollama:
    profiles: [ollama]
    image: ollama/ollama:0.33.3@sha256:32931b46719f673c05fdbaa81ccb26da18ea4a1c57590a754874ab28ba269eb2
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list > /dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20

# 모델은 기동할 때 자동으로 내려받지 않는다. 기동 경로에 네트워크 의존을 만들지
# 않기 위해서이며, 아래를 한 번 실행해 준비한다.
#   docker compose -f compose.dev.yaml --profile ollama up -d ollama
#   docker compose -f compose.dev.yaml --profile ollama exec ollama ollama pull bge-m3
networks:
  default: {}
  # 서버 profile에서만 사용한다. 기본 DB·Ollama 네트워크는 변경하지 않는다.
  tunnel:
    ipam:
      config:
        - subnet: 10.204.0.0/24
          gateway: 10.204.0.1

volumes:
  db_data:
  ollama_data:
