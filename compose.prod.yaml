# 운영 배포 구성. 개발 구성은 compose.dev.yaml이 다룬다.
#
# 실행: cp .env.prod.example .env 로 값을 채운 뒤
#   docker compose -f compose.prod.yaml up -d --build
#
# Cloudflare DNS 프록시가 TLS를 종단하고 호스트에는 HTTP로 접속한다(Flexible).
# 원본 구간은 암호화되지 않는 시험 운영 예외다. OCI·호스트 방화벽의 원본 접근 제한과
# 보안 제약은 OPERATIONS.md를 따른다. DB는 호스트에 공개하지 않는다.
# 프로젝트 이름을 고정해 같은 호스트의 개발 구성과 컨테이너·볼륨이 섞이지 않게 한다.
name: agent_context_prod

# migrate와 server가 함께 받는 애플리케이션 구성이다. 나머지 배포 구성 값은 .env에서
# 읽고, 아래 값만 이 배치에 맞게 덮어쓴다.
x-app-environment: &app-environment
  # 비밀번호는 URL에 그대로 넣으므로 영문·숫자처럼 퍼센트 인코딩이 필요 없는 문자만 쓴다.
  DATABASE_URL: postgres://${POSTGRES_USER:-agent_context}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD가 필요하다}@db:5432/${POSTGRES_DB:-agent_context}

services:
  db:
    build: .
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agent_context}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD가 필요하다}
      POSTGRES_DB: ${POSTGRES_DB:-agent_context}
    volumes:
      - db_data:/var/lib/postgresql
      # 보관본은 데이터와 다른 볼륨에 둔다. 기본 백업과 함께 따로 옮기거나 정리하기 위해서다.
      - wal_archive:/var/lib/postgresql/wal_archive
    # 「백업과 복구」가 시점 복구를 백업 방식으로 확정했으므로 WAL 보관을 켠다. 개발 구성의
    # 시간 기준 정리는 운영 보존 정책으로 쓰지 않는다. 보관본은 계속 쌓이므로 운영자가 기본
    # 백업을 받은 뒤 그 백업보다 오래된 보관본을 정리하고 볼륨 사용량을 감시한다.
    command:
      - postgres
      - -c
      - shared_preload_libraries=age
      - -c
      - archive_mode=on
      - -c
      - archive_command=test ! -f /var/lib/postgresql/wal_archive/%f && cp %p /var/lib/postgresql/wal_archive/%f
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agent_context} -d ${POSTGRES_DB:-agent_context}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # 스키마 적용. 자문 잠금 안에서 미적용 파일만 적용하고 끝나므로 기동마다 실행해도 된다.
  migrate:
    build: &app-build
      context: .
      dockerfile: Dockerfile.server
    image: agent_context_prod-app
    command: ["migrate", "up"]
    env_file:
      - path: .env
        required: false
    environment: *app-environment
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  server:
    build: *app-build
    image: agent_context_prod-app
    command: ["server"]
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      <<: *app-environment
      HTTP_ADDR: ":8080"
      TLS_TERMINATION: proxy
      # 2026-10-05 공식 https://www.cloudflare.com/ips-v4/ · ips-v6/ 대역.
      # 실제 접속자가 이 대역이고 X-Forwarded-Proto가 https일 때만 처리한다.
      # 전체 네트워크나 Docker 게이트웨이를 신뢰하지 않는다. 갱신 시 정적 검사도 맞춘다.
      TRUSTED_PROXY_CIDRS: "173.245.48.0/20,103.21.244.0/22,103.22.200.0/22,103.31.4.0/22,141.101.64.0/18,108.162.192.0/18,190.93.240.0/20,188.114.96.0/20,197.234.240.0/22,198.41.128.0/17,162.158.0.0/15,104.16.0.0/13,104.24.0.0/14,172.64.0.0/13,131.0.72.0/22,2400:cb00::/32,2606:4700::/32,2803:f800::/32,2405:b500::/32,2405:8100::/32,2a06:98c0::/29,2c0f:f248::/32"
      TLS_CERT_FILE: ""
      TLS_KEY_FILE: ""
    ports:
      - "0.0.0.0:${HTTP_PORT:-80}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # 상태 확인 경로만 전달 헤더 없이 내부 HTTP 프로브를 허용한다.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
    # 서버는 종료 신호 뒤 요청을 30초, 작업자를 10초까지 기다린다. 그보다 길게 멈추면
    # 강제 종료한다.
    stop_grace_period: 50s

networks:
  default:
    ipam:
      config:
        - subnet: 10.203.0.0/24
          gateway: 10.203.0.1

volumes:
  db_data:
  wal_archive:
