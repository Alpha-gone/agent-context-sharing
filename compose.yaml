# 개발용 데이터베이스와 임베딩 제공자. 운영 배포 구성은 이 파일이 다루지 않는다.
services:
  db:
    build: .
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agent_context}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agent_context}
      POSTGRES_DB: ${POSTGRES_DB:-agent_context}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18부터 공식 이미지가 /var/lib/postgresql 아래 판별 하위 디렉터리에
      # 데이터를 두므로 /var/lib/postgresql/data가 아니라 상위를 마운트한다.
      - db_data:/var/lib/postgresql
    # 베이스 이미지의 CMD를 덮으므로 shared_preload_libraries=age를 그대로 다시 준다.
    # WAL 보관을 켜는 이유는 「백업과 복구」가 시점 복구를 백업 방식으로 확정했고, AGE가
    # 그래프를 스키마 OID로 기록해 논리 덤프로는 복원이 성립하지 않기 때문이다. 보관 경로는
    # 데이터 볼륨 안에 두어 기본 백업과 함께 남는다.
    command:
      - postgres
      - -c
      - shared_preload_libraries=age
      - -c
      - archive_mode=on
      - -c
      - archive_command=test ! -f /var/lib/postgresql/wal_archive/%f && cp %p /var/lib/postgresql/wal_archive/%f
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agent_context} -d ${POSTGRES_DB:-agent_context}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # WAL 보관본 정리. `archive_mode=on`이 켜져 있는 한 PostgreSQL은 보관한 파일을
  # 지우지 않으므로 개발 구성에서는 보관 디렉터리가 계속 커진다. 개발 구성은 기본
  # 백업을 남겨 두지 않고 시점 복구를 확인할 때마다 그 자리에서 새로 받으므로,
  # 보관 기간을 지난 WAL은 되돌릴 대상이 없어 쓸모가 없다. 기본 7일이며 운영 배포
  # 구성은 이 파일이 다루지 않는다.
  #
  # `pg_archivecleanup`이 아니라 시간 기준으로 지우는 이유는 그 도구가 남겨 둘 가장
  # 오래된 WAL 이름을 기본 백업의 `.backup` 파일에서 받는데, 개발 구성에는 그 기준이
  # 되는 기본 백업이 없기 때문이다.
  wal_cleanup:
    build: .
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - db_data:/var/lib/postgresql
    # 보관 파일의 소유자와 같은 사용자로 지운다.
    user: postgres
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        while true; do
        find /var/lib/postgresql/wal_archive -type f
        -mtime +${WAL_ARCHIVE_RETENTION_DAYS:-7} -delete;
        sleep 86400;
        done

  # 임베딩 제공자. SRS의 「임베딩 모델」이 제공자를 배포 구성으로 두었고 개발 계획
  # 0단계가 자체 호스팅을 골랐다. 색인의 본문 임베딩과 검색의 질의 임베딩이 모두
  # 이 서비스를 거치며, 자체 호스팅이라 두 값이 격리 경계를 나가지 않는다.
  ollama:
    image: ollama/ollama:latest
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list > /dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20

# 모델은 기동할 때 자동으로 내려받지 않는다. 기동 경로에 네트워크 의존을 만들지
# 않기 위해서이며, 아래를 한 번 실행해 준비한다.
#   docker compose exec ollama ollama pull bge-m3
volumes:
  db_data:
  ollama_data:
